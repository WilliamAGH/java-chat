# Gradle Build Configuration

# Enable parallel builds for better performance
org.gradle.parallel=true

# Cache Gradle builds
org.gradle.caching=true

# Reuse the configured task graph across repository build lanes
org.gradle.configuration-cache=true

# Enable Gradle daemon
org.gradle.daemon=true

# Configure JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable file-system watching: macOS FSEvents stream limit is exhausted by the
# large test matrix in this repo, causing corrupted VFS state and intermittent
# test-result write failures. Builds remain correct; only incremental re-use is slower.
org.gradle.vfs.watch=false
