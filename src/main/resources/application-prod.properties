# Production overrides for javachat.ai. The runtime image activates this
# profile via SPRING_PROFILE=prod (Dockerfile); all other production defaults
# live in application.properties.

# Clerk production instance (clerk.javachat.ai); azp accepts only the public
# site origin. JWKS keys are fetched lazily on the first bearer-token request,
# so startup never depends on Clerk DNS being reachable.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://clerk.javachat.ai
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://clerk.javachat.ai/.well-known/jwks.json
app.clerk.authorized-parties=https://javachat.ai
