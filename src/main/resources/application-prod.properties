# Production overrides for javachat.ai. The runtime image activates this
# profile via SPRING_PROFILE=prod (Dockerfile); all other production defaults
# live in application.properties.

# Clerk production instance (clerk.javachat.ai); azp accepts only the public
# site origin. JWKS keys are fetched lazily on the first bearer-token request,
# so startup never depends on Clerk DNS being reachable.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://clerk.javachat.ai
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://clerk.javachat.ai/.well-known/jwks.json
app.clerk.authorized-parties=https://javachat.ai

# Baseline policy plus the Clerk production instance: FAPI origin in script/connect,
# avatars from img.clerk.com, bot-protection frames/scripts from Cloudflare and
# protect.clerk.com. Production instances send no clerk-telemetry.
app.content-security-policy=default-src 'self'; script-src 'self' https://clerk.javachat.ai https://challenges.cloudflare.com https://*.protect.clerk.com https://static.getclicky.com https://scripts.simpleanalyticscdn.com; connect-src 'self' https://clerk.javachat.ai https://*.protect.clerk.com https://in.getclicky.com https://queue.simpleanalyticscdn.com; img-src 'self' data: https://img.clerk.com https://in.getclicky.com https://queue.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'
