spring.application.name=java-chat

# Spring Profile (dev, prod)
spring.profiles.active=${SPRING_PROFILE:prod}

# HTTP server (restricted to 8085-8090 by PortInitializer)
server.port=${PORT:8085}
server.forward-headers-strategy=framework

# Canonical public base URL used for SEO responses (sitemap.xml, robots.txt, OpenGraph/canonical tags)
app.public-base-url=${PUBLIC_BASE_URL:https://javachat.ai}

# Clicky analytics (enabled by default in prod; disable in dev profile)
app.clicky.enabled=true
app.clicky.site-id=101501246

# Memory-sensitive defaults for 512MB container budgets
# Note: lazy-initialization=true defers bean creation to first use, reducing startup memory but moving errors to runtime
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:true}
spring.http.codecs.max-in-memory-size=${SPRING_HTTP_CODECS_MAX_IN_MEMORY_SIZE:1MB}

# OpenAI Java SDK streaming configuration (OpenAIStreamingService)
# Base URLs are used by the SDK directly (not Spring AI).
# Base URL defaults are owned by OpenAIStreamingService; model defaults are owned by
# OpenAiRequestFactory and ModelConfiguration. Environment variables override them.
# OPENAI_MODEL is a non-blank gateway chat alias; gpt-5.4 is only its default.
# Leave app.llm.reasoning-effort unset to preserve the gateway/model default; set it only for an explicit override.
# Streaming timeout: OPENAI_STREAMING_REQUEST_TIMEOUT_SECONDS (default: 90).
# Java Chat enforces a 20-second visible-output deadline; the gateway owns lower-level transport policy.
# Java Chat sends chat to the configured gateway and does not implement client-side provider fallback.

# Embeddings use the same OpenAI-compatible gateway URL and credential as chat.
# OPENAI_MODEL remains chat-only; the embedding model is owned below.
# Toggle for local embeddings (when true, uses LocalEmbeddingModel)
# Set to true to use your local embedding server
app.local-embedding.enabled=${APP_LOCAL_EMBEDDING_ENABLED:false}
# Local embedding server configuration - set default to allowed range (8085-8090)
app.local-embedding.server-url=${LOCAL_EMBEDDING_SERVER_URL:http://127.0.0.1:8088}
app.local-embedding.model=${APP_LOCAL_EMBEDDING_MODEL:qwen/qwen3-embedding-4b}
app.local-embedding.dimensions=${APP_LOCAL_EMBEDDING_DIMENSIONS:2560}
app.local-embedding.batch-size=${APP_LOCAL_EMBEDDING_BATCH_SIZE:32}
app.embeddings.model=qwen/qwen3-embedding-4b
app.embeddings.dimensions=2560
app.embeddings.live-max-concurrent-requests=8
app.embeddings.batch-max-concurrent-requests=1
app.embeddings.live-requests-per-second=8.0
app.embeddings.batch-requests-per-second=1.0

# Qdrant configuration (defaults to local Docker)
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_SSL:false}
# Hybrid collection config (replaces single-collection Spring AI VectorStore)
app.qdrant.collections.books=${QDRANT_COLLECTION_BOOKS:java-chat-qwen3-embedding-4b-2560-books}
app.qdrant.collections.docs=${QDRANT_COLLECTION_DOCS:java-chat-qwen3-embedding-4b-2560-docs}
app.qdrant.collections.articles=${QDRANT_COLLECTION_ARTICLES:java-chat-qwen3-embedding-4b-2560-articles}
app.qdrant.collections.pdfs=${QDRANT_COLLECTION_PDFS:java-chat-qwen3-embedding-4b-2560-pdfs}
app.qdrant.dense-vector-name=${QDRANT_DENSE_VECTOR_NAME:dense}
app.qdrant.sparse-vector-name=${QDRANT_SPARSE_VECTOR_NAME:bm25}
app.qdrant.prefetch-limit=${HYBRID_PREFETCH_LIMIT:14}
app.qdrant.rrf-k=${HYBRID_RRF_K:60}
app.qdrant.dense-prefetch-hnsw-ef=24
app.qdrant.query-timeout=${HYBRID_QUERY_TIMEOUT:10s}
app.qdrant.ensure-collections=false

# Retrieval defaults (match AppProperties.Rag)
app.rag.chunk-max-tokens=${RAG_CHUNK_MAX_TOKENS:900}
app.rag.chunk-overlap-tokens=${RAG_CHUNK_OVERLAP_TOKENS:150}
app.rag.search-top-k=${RAG_TOP_K:8}
app.rag.search-return-k=${RAG_RETURN_K:6}
app.rag.search-citations=${RAG_CITATIONS_K:3}
app.rag.search-mmr-lambda=${RAG_MMR_LAMBDA:0.5}
app.rag.reranker-timeout=${RAG_RERANKER_TIMEOUT:8s}

# LLM defaults used by openai-java streaming service
# gpt-5.4 is a reasoning generation: the upstream accepts only the default temperature (1.0)
# on the Responses API and answers HTTP 400 to any other value.
app.llm.temperature=1.0
app.llm.reranker-temperature=1.0
app.llm.completion-output-token-budget=4000
app.llm.enrichment-output-token-budget=4000
app.llm.reranker-output-token-budget=512
app.llm.configured-provider-backoff-seconds=600

# Guided learning - Think Java 2nd Edition book integration

# Java 25 docs crawl root (immutable snapshot target)
app.docs.root-url=${DOCS_ROOT_URL:https://docs.oracle.com/en/java/javase/25/}
app.docs.jdk-version=${DOCS_JDK_VERSION:25}
app.docs.snapshot-dir=${DOCS_SNAPSHOT_DIR:/app/data/qwen3-embedding-4b-2560/${SPRING_PROFILE:prod}/snapshots}
app.docs.parsed-dir=${DOCS_PARSED_DIR:/app/data/qwen3-embedding-4b-2560/${SPRING_PROFILE:prod}/parsed}
app.docs.index-dir=${DOCS_INDEX_DIR:/app/data/qwen3-embedding-4b-2560/${SPRING_PROFILE:prod}/index}

# Ensure Qdrant payload indexes on boot so metadata filtering works reliably.
app.qdrant.ensure-payload-indexes=${APP_QDRANT_ENSURE_PAYLOAD_INDEXES:true}

# Static Resources Configuration
# Default to no-store so HTML shells are always revalidated; WebMvcConfig owns cacheable asset paths.
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.web.resources.cache.period=0
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# CORS Configuration (production defaults)
app.cors.allowed-origins=http://localhost:8085,http://127.0.0.1:8085,https://dev.javachat.ai,https://javachat.ai
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age-seconds=3600

# Contact/support form email delivery (self-hosted SMTP, STARTTLS on submission port)
# SMTP credentials are PROHIBITED here: they come only from the environment via Spring
# relaxed binding (SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD). Prod fails fast at
# startup when they are absent (RequiredMailCredentialValidation).
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.contact.recipient-email=support@javachat.ai
app.contact.sender-email=noreply@javachat.ai

# Clerk authentication is intentionally absent here: the dev profile
# (dev.javachat.ai and local development) and the prod profile (javachat.ai)
# each configure the resource server against their own Clerk instance.
# Without spring.security.oauth2.resourceserver.jwt.jwk-set-uri the Clerk
# JwtDecoder bean is not created and /api/me denies every request.

# Content-Security-Policy applied by SecurityConfig to every application response.
# This Clerk-less baseline covers environments without an instance; the dev and
# prod profiles replace it wholesale with their Clerk frontend-API origin added.
# Sources: Clicky (static/in.getclicky.com), Simple Analytics
# (scripts/queue.simpleanalyticscdn.com), Google Fonts (googleapis/gstatic);
# style-src 'unsafe-inline' is required by Clerk's runtime CSS injection.
app.content-security-policy=default-src 'self'; script-src 'self' https://static.getclicky.com https://scripts.simpleanalyticscdn.com; connect-src 'self' https://in.getclicky.com https://queue.simpleanalyticscdn.com; img-src 'self' data: https://in.getclicky.com https://queue.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'

# Actuator
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,qdrant
management.endpoint.health.group.dependencies.include=qdrant,embeddingModelKeepAlive
management.info.build.enabled=true
management.info.env.enabled=true
info.application.name=${spring.application.name}
info.deployment.commit=${SOURCE_COMMIT:unknown}
# Reduce Qdrant client warning verbosity via logging
logging.level.io.qdrant=ERROR
# Suppress PDFBox font mapping warnings (these are harmless)
logging.level.org.apache.pdfbox.pdmodel.font=ERROR

# Spring Security - configuration
# Keep UserDetailsService auto-config disabled to avoid default user + password logging
# but allow SecurityAutoConfiguration so HttpSecurity is available for our filters
# Exclude OpenAI models that require API keys to prevent startup failures
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# Disable unused Spring AI chat/embedding auto-config by default (we use openai-java for chat)
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
