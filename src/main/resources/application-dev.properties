# Development Profile Configuration
# This file is automatically loaded when SPRING_PROFILES_ACTIVE=dev

# Canonical public base URL used for SEO responses in dev.
# Override with PUBLIC_BASE_URL=https://dev.javachat.ai for deployed dev.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8085}

# Disable Clicky by default for local development.
app.clicky.enabled=false

# OpenAI Java SDK streaming configuration (OpenAIStreamingService)
# Base URLs are used by the SDK directly (not Spring AI).
# OPENAI_BASE_URL must identify the shared gateway.
# Dev inherits the absent app.llm.reasoning-effort default; set it only for an explicit override.
# Streaming timeout: OPENAI_STREAMING_REQUEST_TIMEOUT_SECONDS (default: 90).
# Java Chat enforces a 20-second visible-output deadline; the gateway owns lower-level transport policy.
# Java Chat sends chat to the configured gateway and does not implement client-side provider fallback.

# DevTools Configuration for Live Refresh
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/static,src/main/resources/templates
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=${LIVERELOAD_PORT:35730}

# Static Resource Configuration for Development
# Enable caching disabled for static resources during development
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Enable template caching disabled for development (if using templates)
spring.thymeleaf.cache=false

# Logging for DevTools (optional - helps debug restart behavior)
logging.level.org.springframework.boot.devtools=DEBUG

# Development-specific overrides
# More verbose logging for development.
#
# `dev` is also the profile the deployed dev.javachat.ai runs under, so anything set here ships
# to Loki. org.springframework.web at DEBUG was 99.5% of this service's log volume — a 5,000-line
# sample over 3h on 2026-08-04 held 1,991 DispatcherServlet + 1,990 HttpEntityMethodProcessor +
# 994 RequestResponseBodyMethodProcessor lines against 24 application lines, essentially all of it
# request plumbing for the 15s /actuator/prometheus scrape. It buried the signal that matters
# (EmbeddingModelKeepAlive, which the java-chat Loki alert rules parse) and cost 73,705 lines/24h
# against production's 1,233. Raise it locally when debugging Spring MVC itself, e.g.
# `--logging.level.org.springframework.web=DEBUG`, rather than for every deployed request.
logging.level.com.williamcallahan.javachat=DEBUG
logging.level.org.springframework.ai=DEBUG

# CORS for Vite dev server (port 5173) + local Spring Boot (port 8085) + deployed dev host.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8085,http://127.0.0.1:8085,https://dev.javachat.ai

# Clerk development instance (romantic-cow-6); mirrors the local origins above for azp checks.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://romantic-cow-6.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://romantic-cow-6.clerk.accounts.dev/.well-known/jwks.json
app.clerk.authorized-parties=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8085,http://127.0.0.1:8085,https://dev.javachat.ai

# Baseline policy plus the Clerk development instance: FAPI origin in script/connect,
# avatars from img.clerk.com, bot-protection frames/scripts from Cloudflare and
# protect.clerk.com, and clerk-telemetry.com (dev instances only).
app.content-security-policy=default-src 'self'; script-src 'self' https://romantic-cow-6.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com https://static.getclicky.com https://scripts.simpleanalyticscdn.com; connect-src 'self' https://romantic-cow-6.clerk.accounts.dev https://*.protect.clerk.com https://clerk-telemetry.com https://in.getclicky.com https://queue.simpleanalyticscdn.com; img-src 'self' data: https://img.clerk.com https://in.getclicky.com https://queue.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'

# Disable security for easier development (if needed)
# management.security.enabled=false
